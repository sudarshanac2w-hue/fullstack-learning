<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>cricket match scored card</title>
    </head>
    <body>
        <header>
            <h2>Event Registration</h2>
        </header>
        <h2>
            Event Information
        </h2>
        <p>Welcom to Today s event</p>
        <p>
            <b>event date:</b> 25 sep 2026
            </br>
            <b>venue:</b> pune
        </p>
        
        <img src="event.png" alt="event image">

        <form>
            <fieldset>
                <legend>Registration detailes</legend>
                
                 <label for="textfield">Name:</label>
                <input type="text"  name="name" id="textfield" placeholder="Enter your name">
                </br>
                </br>
                 <label for="emailfield">email:</label>
                 <input type="email"  name="email" id="emailfield" placeholder="Enter your email">
                 </br>
                 </br>
                 <label for="contactfield"> Contact No:</label>
                 <input type="tel"  name="contact no" id="contactfield" placeholder="Enter your contact No">
                 </br>
                 </br>
                 <label for="datefield">Date:</label>
                 <input type="date"  name="date" id="datefield" placeholder="Enter event date">
                 </br>
                 </br>
                 <label for="particpantsfield">No of participants:</label>
                 <input type="number"  name=" participants" id="participantsfield" placeholder="Enter member count" min="1">

                 <h2>select event type</h2>
                 <label for="radio1">competition </label>
                 <input type="radio"  name="radio" id="radio1">
            
                   
                 <label for="radio2">seminar </label>
                 <input type="radio"  name="radio" id="radio2">

                 <h2>activity Preference</h2>
                 <label for="chekbox1">coding :</label>
                 <input type="checkbox"  name="checkbox" id="checkbox1">
                 <br/>
                 <br/> 
                 <label for="chekbox2">Drawing :</label>
                 <input type="checkbox"  name="checkbox" id="checkbox2">
                 <br/>
                 <br/> 
                 <label for="chekbox3">speech :</label>
                 <input type="checkbox"  name="checkbox" id="checkbox3">
                 <br/>
                 <br/> 
                 <label for="chekbox4"> Quiz:</label>
                 <input type="checkbox"  name="checkbox" id="checkbox4">
                 <br/>
                 <br/>   
                 
                   
                 <input type="checkbox" name="terms" id="checkbox">
                  <label for="checkbox">I agree to the Terms & Conditions</label>

                 <br/>
                 <br/>
                 <label for="button">Register</label>
                 <input type="submit"  name="button" id="button" value="register">
                 <label for="button">Reset</label>
                 <input type="reset"  name="button" id="button" value="reset">
            </fieldset>   

        </form>
        <h2>useful links</h2>
        <a href="https://www.core2web.in/">Core2web</a>


    </body>
</html>
