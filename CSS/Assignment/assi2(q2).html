<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping</title>

    <style>
        #store {
            font-size: 24px;
        }

        #product {
            font-size: 14px;
        }

        #product h2 {
            text-align: center;
            font-family: Georgia;
            font-weight: 700;
        }

        #product p {
            text-decoration: none;
            font-family: "Courier New";
            font-weight: 300;
        }
    </style>
</head>

<body>

    <div id="store">

        <div id="product">

            <h2>Wireless Headphones</h2>

            <p>Best sound quality with 30 hours battery backup.</p>

        </div>

    </div>

</body>
</html>
