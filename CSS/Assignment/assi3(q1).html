<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card</title>

    <style>
        #card {
            width: 300px;
            height: 400px;
            border-width: 3px;
            border-style: solid;
            border-color: navy;
            border-radius: 20px;
            background-color: pink;
            text-align: center;
        }

        #card img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
        }

        #card h2 {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="card">

        <img src="./profile.png" alt="Student Photo">

        <h2>Student Name:sudha</h2>

        <p>Roll Number:60</p>

        <p>Department:Information Technology</p>

    </div>

</body>
</html>
