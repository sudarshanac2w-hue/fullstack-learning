<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Product Showcase</title>

    <style>
        #product-box {
            width: 350px;
            height: 500px;
            border: 4px dashed green;
            border-radius: 15px;
            background-color: lightgray;
            text-align: center;
            margin: auto;
        }

        #product-box img {
            width: 250px;
            height: 200px;
            border-radius: 12px;
            margin-top: 20px;
        }

        #product-box button {
            background-color: blue;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <div id="product-box">

        <img src="./headphone.png" alt="Headphones">

        <h2> Headphones</h2>

        <p>
            Hight quality headphones with best sound quality
        </p>

        <h3>Price: 666/-</h3>

        <button>Buy Now</button>

    </div>

</body>
</html>
