<DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>cards
        </title>
        <style>
            *{
                margin:0;
                padding: 0;
                box-sizing: border-box;
            }
            .container{
                width: 100vw;
                height:100vh;
                min-height: 900px;
                background: hsl(200, 59%, 65%);
                display: flex;
                justify-content: center;
                align-items: center;

                
            }
            .card{
                width: 250px;
                height:400px;
                background-color: white;
                border-radius: 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap:30px;
                padding: 20px;
            }
            .card img{
                height:40%;
                border-radius: 10px;
            }
            .card h2{
                font-weight: bold;
                font-size:1.4rem ;
            }
            .card p{
                font-size: 1em;
            }
        </style>
        
    </head>
    <body>
        <div class="container">
            <div class="card">
                <img src="burger.jpg"/>
                <h2>
                    Improve your front end skill buy developing projects
                </h2>
                <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Quia itaque at ipsa maiores esse quo perspiciatis culpa. Tempore!</p>

            </div>

        </div>

    </body>
</html>
