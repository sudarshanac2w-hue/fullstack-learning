<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"
        <meta http-equiv="X-UA-compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width,initial scale=1.0">
        <title>
            Document
        </title>
    </head>
    <body>
        <h2>Event Registration</h2>
        <form>
            <label for="name">Name:</label>
            <br/>
            
            <input type="text" id="name" placeholder="Enter your name">
            <br/>
            

            <label for="emailaid">Email ID:</label>
            <br/>
            <input type="email" id="emailaid" placeholder="Enter your email id">
            <br/>
          
           

            <label for="phonenumber">Phone Number:</label>
            <br/>
            <input type="tel" id="phonenumber" placeholder="Enter your phone number">
            <br/>
            <br/>
            <label for="fileupload">Resume</label>
            <input type="file" id="fileupload">
            <br/>
            <br/>
            <label for=" counter">Experiance (in year):</label>
            <input type="number" name="counter" id="counter" min="0" max="50">
            <br/>
            <br/>
             <fieldset>
                <legend>Skills</legend>
                <label for="html">HTML</label>
                <input type="checkbox" id="html" name="checkboxes" >
                <br/>

                <label for="css">CSS</label>
                <input type="checkbox" id="css" name="checkboxes">
                <br/>

                <label for="javascript">JavaScript</label>
            
                <input type="checkbox" id="javascript" name="checkboxes">
            </fieldset>
            <br/>
            <label for="educationtype">Highest education:</label>
            <select  name="educationtype" id="educationtype">
                <option value="a">A</option>
                <option value="b">B</option>
                <option value="c">C</option>
                <option value="d">D</option>
            </select>
            <br/>
            <fieldset>
                <legend>Availability</legend>
                <label for="radio1">Full-time:</label>
                <input type="radio"  name="radio" id="radio1">
                <br/>
                <label for="radio2">Paer-time:</label>
                <input type="radio"  name="radio" id="radio2">
            
            </fieldset>
             <lable for="textarea">AditionalComments:</lable>
            <br/>
            <textarea name="textarea" id="textarea" cols="30" rows="10" placeholder="Enter your comments here"></textarea>
            <br/>
            <input type="submit" value="submit Apllication">



        </form>
    </body>
</html>
